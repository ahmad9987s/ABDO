<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABDO — النظام المحاسبي</title>
<style>
:root{--r:#d71920;--k:#111;--bg:#f3f3f3;--c:#fff;--t:#111;--b:#ddd;--m:#666;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px/1.5 Tahoma,Arial,sans-serif}
header{background:var(--k);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:4px solid var(--r)}
header h1{margin:0;font-size:20px}header h1 b{color:var(--r)}header .sp{flex:1}header small{color:#bbb}
nav{display:flex;gap:6px;overflow-x:auto;background:var(--k);padding:0 12px 10px}
nav button{background:rgba(255,255,255,.14);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--r)}
main{padding:14px;max-width:1100px;margin:auto}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.sub button.on{background:var(--r);color:#fff;border-color:var(--r)}.iv input{border:0;border-bottom:1px dashed #999;background:transparent;font:inherit;padding:2px;color:#000;width:100%;min-width:0}.ivr{display:flex;gap:6px;align-items:center}.ivr span{white-space:nowrap}.mbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--k);color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));z-index:30;align-items:center;justify-content:space-between;gap:10px}
@media(max-width:760px){body{font-size:14px}header{flex-wrap:wrap;padding:8px 10px}nav{position:sticky;top:0;z-index:20}nav button{padding:10px 14px}main{padding:8px 8px 84px}.card{padding:10px;margin-bottom:10px}input,select{font-size:16px;padding:9px;min-height:42px}button{min-height:40px}.grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}.kp{grid-template-columns:1fr 1fr}table{font-size:13px}th,td{padding:5px}.box{padding:10px}#mod,#dlg{padding:8px}.mbar{display:flex}.login{margin:6vh 12px}}
.fb{border:1px solid var(--b);background:var(--c);border-radius:8px;padding:6px 12px;cursor:pointer;display:inline-block}.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin-bottom:14px;overflow-x:auto}
h3{margin:0 0 10px;border-right:4px solid var(--r);padding-right:8px}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}@media(max-width:760px){.g2{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.it{background:var(--k);color:#fff;border:0;border-bottom:3px solid var(--r);border-radius:10px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.it b{color:#ff8a8f}
button{font:inherit;cursor:pointer;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:6px 12px}
button.pr{background:var(--r);color:#fff;border-color:var(--r)}
input,select{font:inherit;padding:8px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);max-width:100%}
.f{display:flex;flex-wrap:wrap;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--b)}
.tot{font-size:18px;font-weight:700;color:var(--r)}.m{color:var(--m)}
table{width:100%;border-collapse:collapse}th{background:var(--k);color:#fff;padding:7px;text-align:right}td{padding:7px;border-bottom:1px solid var(--b)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}.kp div{background:var(--k);color:#fff;border-radius:10px;padding:10px;border-right:4px solid var(--r)}.kp b{display:block;font-size:19px}.kp small{color:#ffb3b6}
.login{max-width:340px;margin:12vh auto;background:var(--c);border-top:6px solid var(--r);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:10px;text-align:center}
.login h1{margin:0}.login h1 b{color:var(--r)}.err{color:var(--r)}
.ic{border:1px solid var(--b);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px}.ic img,.ph,.it img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.ph{background:#222;display:grid;place-items:center;font-size:32px}
#rcpt{display:none}
#mod,#dlg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;overflow:auto;padding:16px}#dlg{z-index:60}#mod.on,#dlg.on{display:block}.box{background:var(--c);color:var(--t);max-width:780px;margin:auto;border-radius:12px;padding:14px;border-top:5px solid var(--r)}#pv{background:#fff;color:#000;padding:12px;margin:auto;font-size:13px}.fm{display:grid;gap:8px}.fm label{display:grid;gap:3px;font-size:13px;color:var(--m)}
@media print{body>*:not(#mod){display:none!important}#mod{position:static;background:#fff;padding:0}.box{border:0;padding:0}.noprint{display:none!important}}
</style>

SV.us0=()=>!can('us')?'<p>للمدير فقط</p>':`<section class=card><h3>إضافة حساب</h3><div class=f><input id=nu placeholder="اسم المستخدم"><input id=np placeholder="كلمة المرور"><label><input id=na type=checkbox> مدير</label><button class=pr onclick=addU()>إضافة</button></div></section>
 <section class=card><h3>الحسابات</h3><table><tr><th>المستخدم</th><th>الصلاحية</th><th></th></tr>${S.users.map(u=>`<tr><td>${e(u.u)}${u.em?'<br><small class=m>'+e(u.em)+'</small>':''}</td><td>${u.a?'مدير (كل الصلاحيات)':e(PERM.filter(([k])=>u.perms&&u.perms[k]).map(x=>x[1].split(' (')[0]).join('، '))||'— بدون —'}</td><td><button onclick="editU('${e(u.u)}')">تعديل</button> <button onclick="perm('${e(u.u)}')">الصلاحيات</button> <button onclick="tmpc('${e(u.u)}')">رمز مؤقت</button> ${u.u==me.u?'':`<button onclick="delU('${e(u.u)}')">حذف</button>`}</td></tr>`).join('')}</table></section>`;
function addU(){const u=$('#nu').value.trim(),p=$('#np').value;if(!u||!p||S.users.some(x=>x.u===u))return;S.users.push({u,p,a:$('#na').checked?1:0,perms:{pos:1}});save();render()}
function delU(u){const x=S.users.find(y=>y.u===u);if(x&&x.a&&S.users.filter(y=>y.a).length<2)return toast('لا يمكن حذف آخر مدير');ask('حذف الحساب؟',()=>{S.users=S.users.filter(y=>y.u!==u);save();render()})}
function render(){norm();const A=$('#app');
 if(!me){A.innerHTML=`<div class=login><img src="${LOGO}" style="width:170px;margin:auto" alt="ABDO"><p class=m>النظام المحاسبي</p><input id=lu placeholder="اسم المستخدم"><input id=lp type=password placeholder="كلمة المرور" onkeydown="if(event.key=='Enter')login()"><button class=pr onclick=login()>دخول</button><div class=err id=le></div><a href="#" onclick="fgt();return false" style="font-size:13px">هل نسيت كلمة المرور؟</a></div>`;return}
 const ts=Object.keys(TABS).filter(k=>can(k));if(!ts.includes(tab))tab=ts[0]||'none';
 A.innerHTML=`<header><img src="${LOGO}" style="height:44px;background:#fff;border-radius:8px;padding:2px" alt="ABDO"><span class=sp></span><small id=stt>${e(status)}</small><small>${e(me.u)}</small><button onclick=myacc()>حسابي</button><button onclick=logout()>خروج</button></header><nav>${ts.map(k=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()">${TABS[k]}</button>`).join('')}</nav><main>${(me.a&&(S.rs||[]).length)?`<div class=card style="border-right:5px solid var(--r)">🔑 ${S.rs.length} طلب إعادة تعيين كلمة مرور بانتظار المدير. <button onclick="tab='cfg';sub='us';render()">فتح</button></div>`:''}${me.a&&S.users.some(u=>u.a&&u.p==='ADMIN')?`<div class=card style="border-right:5px solid var(--r)">⚠ كلمة مرور حساب المدير ما زالت الافتراضية (ADMIN). غيّرها من الإعدادات ← المستخدمون ← تعديل.</div>`:''}${V[tab]?V[tab]():'<p>لا توجد صلاحيات لهذا الحساب. راجع المدير.</p>'}</main>`;
 if(PG[tab])fillP();if(tab=='rp')drawCharts()}
render();initCloud();
</script></body></html>
